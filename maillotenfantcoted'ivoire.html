<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maillot Enfant | Ouffstore</title>
<style>
:root {
  --bg: #f5f7fa;
  --blue: #002147;
  --accent: #ff9500;
  --accent-dark: #e07d00;
  --card: #ffffff;
  --text: #222;
  --shadow: 0 6px 18px rgba(0,0,0,0.06);
}
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--blue);
  padding: 10px 20px;
  height: 70px;
}
header .logo img {
  height: 45px;
  flex-shrink: 0;
}
header h1 {
  margin: 0;
  color: var(--accent);
  font-size: 1.6em;
}
.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}
.whatsapp-button {
  background: var(--accent);
  color: white;
  padding: 8px 14px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: 600;
}
.whatsapp-button:hover {
  background: var(--accent-dark);
}
.cart-icon {
  font-size: 20px;
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
#cart-count {
  background: var(--accent);
  color: white;
  border-radius: 50%;
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 700;
}
.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 15px;
}
.main-image {
  width: 100%;
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.gallery {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.gallery img {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: .2s;
}
.gallery img.selected {
  border-color: var(--accent);
}
.description {
  margin-top: 15px;
  background: var(--card);
  padding: 15px;
  border-radius: 12px;
  box-shadow: var(--shadow);
}
form {
  margin-top: 20px;
  background: var(--card);
  padding: 20px;
  border-radius: 12px;
  box-shadow: var(--shadow);
}
form label {
  display: block;
  margin: 8px 0 4px;
  font-weight: 500;
}
form input, form select {
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-bottom: 10px;
}
button {
  background: var(--accent);
  color: white;
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
}
button:hover {
  background: var(--accent-dark);
}
.buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.total {
  font-weight: 700;
  color: var(--blue);
  margin-top: 10px;
  text-align: right;
  font-size: 1em;
}
#confirmation {
  color: green;
  margin-top: 12px;
  text-align: center;
  font-size: 0.95em;
}
@media screen and (max-width:600px) {
  header {flex-wrap: wrap; gap: 8px;}
  header h1 {font-size: 1.4em;}
  .gallery img {width: 55px; height: 55px;}
}
</style>
</head>
<body>

<header>
  <div class="logo"><a href="index.html"><img src="LOGO1.jpg" alt="Logo Ouffstore"></a></div>
  <h1>Ouffstore</h1>
  <div class="header-actions">
    <a href="panier.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
    <a href="https://wa.me/2250703791959" class="whatsapp-button" target="_blank">WhatsApp</a>
  </div>
</header>

<div class="container">
  <h2 style="text-align:center;"> Côte d'Ivoire</h2>
  <img src="images/Maillot Enfant/CI ORANGE.jpg" class="main-image" id="main-image" alt="cote d'ivoire">

  <div class="gallery">
    <img src="images/Maillot Enfant/CI ORANGE.jpg" alt="Orange" data-color="Orange" class="selected">
    <img src="images/Maillot Enfant/CI BLANC.jpg" alt="Blanc" data-color="Blanc">
  </div>

  <div class="description">
    <p><strong>Description :</strong> Maillot + Short Enfant - Équipe Nationale de Côte d'Ivoire 🇨🇮.<br>
    Disponible en plusieurs tailles de 2 à 13 ans. Tissu respirant et confortable.</p>
    <p><strong>Prix :</strong> 10 000 FCFA<br><strong>Livraison :</strong> 1 500 FCFA (fixe)</p>
  </div>

  <form id="orderForm" action="https://formsubmit.co/ouffstore@gmail.com" method="POST">
    <label>Nom complet</label>
    <input type="text" name="nom" required>

    <label>Numéro de téléphone</label>
    <input type="tel" name="telephone" required>

    <label>Adresse de livraison</label>
    <input type="text" name="adresse" required>

    <label>Couleur</label>
    <select name="couleur" id="couleur">
      <option value="Orange">Orange</option>
      <option value="Blanc">Blanc</option>
    </select>

    <label>Âge</label>
    <select name="age">
      <option value="2 ans">2 ans</option>
      <option value="3 ans">3 ans</option>
      <option value="4 ans">4 ans</option>
      <option value="5 ans">5 ans</option>
      <option value="6 ans">6 ans</option>
      <option value="7 ans">7 ans</option>
      <option value="8 ans">8 ans</option>
      <option value="9 ans">9 ans</option>
      <option value="10 ans">10 ans</option>
      <option value="11 ans">11 ans</option>
      <option value="12 ans">12 ans</option>
      <option value="13 ans">13 ans</option>
    </select>

    <label>Quantité</label>
    <input type="number" name="quantite" value="1" min="1" required>

    <div class="total" id="total">Total : 11 500 FCFA</div>

    <div class="buttons">
      <button type="button" id="addToCart">🛒 Ajouter au panier</button>
      <button type="submit">Commander maintenant</button>
    </div>

    <div id="confirmation"></div>
  </form>
</div>

<script>
const price = 10000;
const livraison = 1500;
const totalEl = document.getElementById('total');
const quantityEl = document.querySelector('input[name="quantite"]');
const cartCountEl = document.getElementById('cart-count');
const mainImage = document.getElementById('main-image');
const gallery = document.querySelectorAll('.gallery img');
const selectColor = document.getElementById('couleur');

gallery.forEach(img=>{
  img.addEventListener('click', ()=>{
    gallery.forEach(i=>i.classList.remove('selected'));
    img.classList.add('selected');
    mainImage.src = img.src;
    selectColor.value = img.dataset.color;
  });
});

function updateTotal(){
  const total = (price * Number(quantityEl.value)) + livraison;
  totalEl.textContent = 'Total : ' + total.toLocaleString() + ' FCFA';
}
quantityEl.addEventListener('input', updateTotal);
updateTotal();

// Ajouter au panier
document.getElementById('addToCart').addEventListener('click', ()=>{
  const product = {
    nom: "Maillot + Short | Côte d'Ivoire",
    couleur: selectColor.value,
    age: document.querySelector('select[name="age"]').value,
    quantite: Number(quantityEl.value),
    prix: price,
    livraison: livraison,
    image: mainImage.src
  };

  let panier = JSON.parse(localStorage.getItem('panier')) || [];
  panier.push(product);
  localStorage.setItem('panier', JSON.stringify(panier));
  updateCartCount();
  alert("✅ Produit ajouté au panier !");
});

function updateCartCount(){
  const panier = JSON.parse(localStorage.getItem('panier')) || [];
  cartCountEl.textContent = panier.length;
}
updateCartCount();

// Envoi du formulaire FormSubmit
const form = document.getElementById('orderForm');
form.addEventListener('submit', function(e){
  e.preventDefault();
  fetch(form.action, {
    method:'POST',
    body:new FormData(form),
    headers:{'Accept':'application/json'}
  }).then(response=>{
    if(response.ok){
      document.getElementById('confirmation').textContent="Merci ! Votre commande a été envoyée.";
      form.reset();
      updateTotal();
    } else {
      document.getElementById('confirmation').textContent="Erreur, veuillez réessayer.";
    }
  });
});
</script>

</body>
</html>
