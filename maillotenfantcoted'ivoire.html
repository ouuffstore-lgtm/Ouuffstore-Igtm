<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maillot Enfant | Ouffstore</title>
<style>
:root{
  --bg:#f5f7fa;
  --blue:#002147;
  --accent:#ff9500;
  --accent-dark:#e07d00;
  --card:#ffffff;
  --muted:#d8e0ff;
  --text:#222;
}
body{margin:0;font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
header{display:flex;align-items:center;justify-content:space-between;background:var(--blue);padding:10px 20px;height:70px;}
header .logo img{height:50px;flex-shrink:0;}
header h1{margin:0;color:var(--accent);text-align:center;flex-grow:1;font-size:1.6em;white-space:nowrap;}
.header-actions{display:flex;gap:10px;align-items:center;flex-shrink:0;}
.whatsapp-button{background:var(--accent);color:white;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:600;font-size:0.9em;text-align:center;display:block;}
.whatsapp-button:hover{background:var(--accent-dark);}
.cart-icon{font-size:20px;color:var(--accent);padding:4px 6px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;}
#cart-count{background:var(--accent);color:white;border-radius:50%;padding:1px 5px;font-size:11px;font-weight:700;line-height:1;position:relative;}

.container{max-width:900px;margin:30px auto;padding:0 15px;}
.main-image{width:100%;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06);}
.gallery{display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap;}
.gallery img{width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.gallery img.selected{border-color:var(--accent);}

form{margin-top:20px;background:var(--card);padding:15px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,0.06);}
form label{display:block;margin:8px 0 4px;font-size:0.95em;}
form input, form select, form textarea{width:100%;padding:7px 10px;border-radius:8px;border:1px solid #ccc;margin-bottom:10px;font-size:0.95em;}
form button{background:var(--accent);color:white;padding:10px 14px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:1em;width:100%;}
form button:hover{background:var(--accent-dark);}
.total{font-weight:700;color:var(--blue);margin-top:10px;text-align:right;font-size:1em;}
#confirmation{color:green;margin-top:12px;text-align:center;font-size:0.95em;}

@media screen and (max-width:600px){
  header{flex-direction:row;justify-content:space-between;height:auto;gap:8px;padding:10px;}
  header h1{font-size:1.4em;}
  .gallery img{width:50px;height:50px;}
}
</style>
</head>
<body>

<header>
  <div class="logo"><a href="index.html"><img src="LOGO1.jpg" alt="Logo Ouffstore"></a></div>
  <h1><a href="index.html" style="text-decoration:none;color:inherit;">Ouffstore</a></h1>
  <div class="header-actions">
    <a href="panier.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
    <a href="https://wa.me/2250703791959" class="whatsapp-button" target="_blank">WhatsApp</a>
  </div>
</header>

<div class="container">
  <h2 style="text-align:center;font-size:1.3em;">Maillot + Short | Côte d'Ivoire</h2>
  <img src="images/Maillot Enfant/CI ORANGE.jpg" class="main-image" id="main-image" alt="cote d'ivoire">

  <div class="gallery">
    <img src="images/Maillot Enfant/CI ORANGE.jpg" alt="Orange" data-color="Orange" class="selected">
    <img src="images/Maillot Enfant/CI BLANC.jpg" alt="Blanc" data-color="Blanc">
  </div>

  <form id="orderForm" action="https://formsubmit.co/f/TON_FORM_ID" method="POST">
    <label>Nom complet</label>
    <input type="text" name="nom" required>

    <label>Numéro de téléphone</label>
    <input type="tel" name="telephone" required>

    <label>Adresse de livraison</label>
    <textarea name="adresse" rows="3" placeholder="Ex: Cocody, Abidjan" required></textarea>

    <label>Couleur</label>
    <select name="couleur" id="couleur">
      <option value="Orange">Orange</option>
      <option value="Blanc">Blanc</option>
    </select>

    <label>Âge</label>
    <select name="age">
      <option value="2 ans">2 ans</option>
      <option value="3 ans">3 ans</option>
      <option value="4 ans">4 ans</option>
      <option value="5 ans">5 ans</option>
      <option value="6 ans">6 ans</option>
      <option value="7 ans">7 ans</option>
      <option value="8 ans">8 ans</option>
      <option value="9 ans">9 ans</option>
      <option value="10 ans">10 ans</option>
      <option value="11 ans">11 ans</option>
      <option value="12 ans">12 ans</option>
      <option value="13 ans">13 ans</option>
    </select>

    <label>Quantité</label>
    <input type="number" name="quantite" value="1" min="1" required>

    <div class="total" id="total">Total : 11 500 FCFA</div>

    <button type="submit">Commander</button>
    <div id="confirmation"></div>
  </form>

  <a id="whatsappLink" href="#" class="whatsapp-button" target="_blank" style="margin-top:10px;">💬 Commander via WhatsApp</a>
</div>

<script>
// Gestion galerie et sélection couleur
const mainImage = document.getElementById('main-image');
const gallery = document.querySelectorAll('.gallery img');
const selectColor = document.getElementById('couleur');
const quantityEl = document.querySelector('input[name="quantite"]');
const totalEl = document.getElementById('total');
const whatsappLink = document.getElementById('whatsappLink');
const productName = "Maillot + Short | Côte d'Ivoire";

gallery.forEach(img=>{
  img.addEventListener('click', ()=>{
    gallery.forEach(i=>i.classList.remove('selected'));
    img.classList.add('selected');
    mainImage.src = img.src;
    selectColor.value = img.dataset.color;
    updateWhatsAppLink();
  });
});

// Calcul du total
const price = 10000;
const livraison = 1500;
function updateTotal(){
  const total = (price + livraison) * Number(quantityEl.value);
  totalEl.textContent = 'Total : ' + total.toLocaleString() + ' FCFA';
  updateWhatsAppLink();
}
quantityEl.addEventListener('input', updateTotal);
updateTotal();

// Mise à jour WhatsApp dynamique
function updateWhatsAppLink() {
  const color = selectColor.value;
  const age = document.querySelector('select[name="age"]').value;
  const quantity = quantityEl.value;
  const total = (price + livraison) * Number(quantity);
  const number = "2250703791959";
  const text = `Je souhaite commander ${productName}.\nCouleur: ${color}\nÂge: ${age}\nQuantité: ${quantity}\nTotal: ${total.toLocaleString()} FCFA.`;
  whatsappLink.href = `https://wa.me/${number}?text=${encodeURIComponent(text)}`;
}

// Mise à jour si changement de formulaire
[selectColor, document.querySelector('select[name="age"]'), quantityEl].forEach(el=>{
  el.addEventListener('change', updateWhatsAppLink);
  el.addEventListener('input', updateWhatsAppLink);
});

// Confirmation Formsubmit
const form = document.getElementById('orderForm');
form.addEventListener('submit', function(e){
  e.preventDefault();
  fetch(form.action, {
    method:'POST',
    body:new FormData(form),
    headers:{'Accept':'application/json'}
  }).then(response=>{
    if(response.ok){
      document.getElementById('confirmation').textContent="✅ Merci ! Votre commande a été envoyée.";
      form.reset();
      gallery[0].click();
      updateTotal();
    } else {
      document.getElementById('confirmation').textContent="Erreur, veuillez réessayer.";
    }
  });
});

// Initialisation
updateWhatsAppLink();
</script>

</body>
</html>
